# Spark's built-in Prometheus endpoints. Every process that reads this conf
# (master, workers, drivers) serves its metrics as Prometheus exposition text;
# the paths are what Alloy scrapes (see the scrape targets in the phase 7
# journal). No variables here, so the file is committed, not rendered.
*.sink.prometheusServlet.class=org.apache.spark.metrics.sink.PrometheusServlet
*.sink.prometheusServlet.path=/metrics/prometheus
master.sink.prometheusServlet.path=/metrics/master/prometheus
applications.sink.prometheusServlet.path=/metrics/applications/prometheus
